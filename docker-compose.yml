services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentri-code-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=sentri-code-offline-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sentri-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentri-code-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentri-network

networks:
  sentri-network:
    driver: bridge
